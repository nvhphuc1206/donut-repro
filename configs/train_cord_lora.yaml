# I2 – LoRA: q/v của decoder (self + cross attention) + query/value Swin stage 3–4.
# Embedding: chỉ học hàng của special token mới (tương đương modules_to_save, giữ tie embed/lm_head).
run_id: I2_lora_r8
model_name_or_path: naver-clova-ix/donut-base
dataset: naver-clova-ix/cord-v2
task_token: "<s_cord-v2>"
input_size: [1280, 960]
align_long_axis: false
max_length: 768
epochs: 12
batch_size: 1
grad_accum: 8
lr: 1.0e-4                   # LoRA thường cần lr cao hơn full FT
warmup_steps: 300
scheduler: cosine
fp16: true
gradient_checkpointing: true
num_workers: 2
seed: 42
val_batch_size: 4
output_dir: null
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_decoder: true
  target_encoder_stages: [2, 3]   # chỉ số 0-based -> stage 3 và 4; [] để chỉ LoRA decoder
  train_embeddings: new_rows      # new_rows | full | frozen
notes: "LoRA r=8 a=16, decoder q/v + Swin stage3-4 query/value"
