# I3 – fine-tune thêm vài epoch VỚI augmentation, khởi tạo từ checkpoint tốt nhất của B0.
# Sửa model_name_or_path nếu output_dir của B0 nằm trên Google Drive.
run_id: I3_aug_from_B0
model_name_or_path: outputs/B0_full_1280/best
dataset: naver-clova-ix/cord-v2
task_token: "<s_cord-v2>"
input_size: [1280, 960]
align_long_axis: false
max_length: 768
epochs: 4
batch_size: 1
grad_accum: 8
lr: 1.0e-5
warmup_steps: 50
scheduler: cosine
fp16: true
gradient_checkpointing: true
num_workers: 2
seed: 42
val_batch_size: 4
output_dir: null
augment:
  rotate: {p: 0.3, max_angle: 5.0}
  blur: {p: 0.2, radius: [0.3, 1.2]}
  jpeg: {p: 0.3, quality: [20, 60]}
  color: {p: 0.3, brightness: [0.7, 1.3], contrast: [0.7, 1.3]}
  perspective: {p: 0.2, distortion: 0.06}
notes: "B0 + 4 epoch có augmentation"
