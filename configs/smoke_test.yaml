# Chạy thử nhanh (~3–5 phút, 40 ảnh train, 8 ảnh val) để kiểm tra pipeline train trước khi chạy B0 thật.
run_id: SMOKE
model_name_or_path: naver-clova-ix/donut-base
dataset: naver-clova-ix/cord-v2
task_token: "<s_cord-v2>"
input_size: [960, 720]
max_length: 768
epochs: 1
batch_size: 1
grad_accum: 4
lr: 3.0e-5
warmup_steps: 10
fp16: true
gradient_checkpointing: true
num_workers: 2
train_limit: 40
val_limit: 8
val_batch_size: 4
save_optimizer: false
runs_csv: results/smoke_runs.csv
notes: "smoke test"
